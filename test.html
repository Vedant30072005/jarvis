/* ================= Durability: Persist client (mocked relay) ================= */
/* Async block — awaited before render() runs (see the async wrapper at
   the bottom). Mocks window.fetch so the client's URLs/headers/gating
   are asserted without a live relay. */
async function runPersistTests(){
  const realFetch = window.fetch;
  const calls = [];
  const mockFetch = (responder) => {
    window.fetch = (url, opts) => { calls.push({ url: String(url), opts: opts || {} }); return Promise.resolve(responder(String(url), opts || {})); };
  };
  const jsonRes = (obj) => ({ ok: true, json: () => Promise.resolve(obj), text: () => Promise.resolve(JSON.stringify(obj)) });
  const textRes = (str) => ({ ok: true, json: () => Promise.resolve(JSON.parse(str || '{}')), text: () => Promise.resolve(str) });
  const savedAvail = Persist.available, savedToken = Persist.token;

  try {
    // probe success
    calls.length = 0; Persist.available = false; Persist.token = null;
    mockFetch((url) => url.endsWith('/token') ? jsonRes({ token: 'TESTTOKEN123' }) : jsonRes({}));
    await Persist.probe();
    assert('Persist probe: a reachable relay sets available + stores the write token',
      Persist.available === true && Persist.token === 'TESTTOKEN123' && calls[0].url.endsWith('/token'), JSON.stringify(calls[0]));

    // probe failure (relay down) → stays localStorage-only, no throw
    Persist.available = true; Persist.token = 'stale';
    window.fetch = () => Promise.reject(new Error('ECONNREFUSED'));
    await Persist.probe();
    assert('Persist probe: an unreachable relay leaves available=false and never throws',
      Persist.available === false);

    // mirror: durable key POSTs with the token header
    calls.length = 0; Persist.available = true; Persist.token = 'TESTTOKEN123';
    mockFetch(() => jsonRes({ ok: true }));
    Persist.mirror('jarvis.ledger.v1', '{"v":1,"data":[]}');
    await Promise.resolve();
    assert('Persist mirror: a durable key POSTs to /store/<key> with the X-Jarvis-Token header and the exact body',
      calls.length === 1 && calls[0].url.endsWith('/store/jarvis.ledger.v1') && calls[0].opts.method === 'POST' &&
      calls[0].opts.headers['X-Jarvis-Token'] === 'TESTTOKEN123' && calls[0].opts.body === '{"v":1,"data":[]}',
      JSON.stringify(calls));

    // mirror: NON-durable key is never sent (settings/chat stay local-only)
    calls.length = 0;
    Persist.mirror('jarvis.settings.v1', '{"v":1,"data":{}}');
    assert('Persist mirror: a non-durable key is never mirrored to disk',
      calls.length === 0, JSON.stringify(calls));

    // mirror: no-op when the relay is unavailable
    calls.length = 0; Persist.available = false;
    Persist.mirror('jarvis.ledger.v1', '{}');
    assert('Persist mirror: no relay → silent no-op, no fetch attempted',
      calls.length === 0);

    // restore: returns disk text, null on empty
    Persist.available = true; Persist.token = 'TESTTOKEN123';
    mockFetch((url) => url.includes('jarvis.goals.v1') ? textRes('{"v":1,"data":[{"id":"g1"}]}') : textRes(''));
    const got = await Persist.restore('jarvis.goals.v1');
    const empty = await Persist.restore('jarvis.journal.v1');
    assert('Persist restore: returns the disk copy for a written key, null for an empty one',
      got === '{"v":1,"data":[{"id":"g1"}]}' && empty === null, JSON.stringify({ got, empty }));

    // restoreMissing: only restores keys ABSENT from localStorage
    ['jarvis.ledger.v1','jarvis.journal.v1','jarvis.predictions.v1','jarvis.goals.v1','jarvis.sundayreview.v1','jarvis.taught.v1','jarvis.portfolio.v1'].forEach(k => localStorage.removeItem(k));
    localStorage.setItem('jarvis.ledger.v1', '{"v":1,"data":["already here"]}'); // this one must NOT be overwritten
    mockFetch((url) => url.includes('jarvis.goals.v1') ? textRes('{"v":1,"data":["from disk"]}') : textRes(''));
    const restored = await Persist.restoreMissing();
    assert('Persist restoreMissing: restores a disk-only key into localStorage, returns it in the list',
      restored.includes('jarvis.goals.v1') && localStorage.getItem('jarvis.goals.v1') === '{"v":1,"data":["from disk"]}',
      JSON.stringify(restored));
    assert('Persist restoreMissing: never overwrites a key that localStorage already holds',
      !restored.includes('jarvis.ledger.v1') && localStorage.getItem('jarvis.ledger.v1') === '{"v":1,"data":["already here"]}',
      localStorage.getItem('jarvis.ledger.v1'));
    ['jarvis.ledger.v1','jarvis.goals.v1'].forEach(k => localStorage.removeItem(k));

    // Schema.save integration: a durable save triggers a mirror POST
    calls.length = 0; Persist.available = true; Persist.token = 'TESTTOKEN123';
    mockFetch(() => jsonRes({ ok: true }));
    Schema.save('jarvis.goals.v1', 1, [{ id: 'gx' }]);
    await Promise.resolve();
    assert('Persist ↔ Schema: Schema.save of a durable key fires exactly one mirror POST with the wrapped envelope',
      calls.length === 1 && calls[0].url.endsWith('/store/jarvis.goals.v1') && JSON.parse(calls[0].opts.body).v === 1,
      JSON.stringify(calls[0] && { url: calls[0].url, body: calls[0].opts.body }));
    localStorage.removeItem('jarvis.goals.v1');
  } finally {
    window.fetch = realFetch;
    Persist.available = savedAvail; Persist.token = savedToken;
  }
}

/* ---------------- ORD-901: amount dedup (order's own worked example) ---------------- */
(function(){
  // Realistic wire syndication: 4 outlets running near-identical copy of the
  // same PTI/Reuters-fed story (this is what "4 copies of the same story"
  // looks like in practice — boilerplate-identical, not independently
  // reworded), so title-shingle Jaccard J=1.0 merges them cleanly.
  const raw = [
    { id:'d1', cat:'corporate', s:'Reuters India', h:1, t:'Reliance commits ₹75,000 crore to giga energy complex in Gujarat', b:'' },
    { id:'d2', cat:'corporate', s:'Bloomberg Asia', h:3, t:'Reliance commits ₹75,000 crore to giga energy complex in Gujarat', b:'' },
    { id:'d3', cat:'corporate', s:'ET Corporate', h:8, t:'Reliance commits ₹75,000 crore to giga energy complex in Gujarat', b:'' },
    { id:'d4', cat:'corporate', s:'Mint', h:20, t:'Reliance commits ₹75,000 crore to giga energy complex in Gujarat', b:'' }
  ];
  Engine.run(raw);
  assert('ORD-901: 4 duplicate reports of the same ₹75,000cr story → 1 group',
    Engine.groups.length === 1, `groups=${Engine.groups.length}`);
  assert('ORD-901: totalTracked reads 75,000 (MAX, not SUM of 4x)',
    Engine.totalTracked() === 75000, `totalTracked=${Engine.totalTracked()}`);
  assert('ORD-301: group is CONFIRMED (4 distinct sources)',
    Engine.items.every(i => i.confirmed === true && i.groupSize === 4),
    JSON.stringify(Engine.items.map(i => [i.confirmed, i.groupSize])));
  assert('ORD-901: exactly one flow record for the deduped group',
    Engine.flows.length === 1 && Engine.flows[0].dedupedFrom === 4,
    JSON.stringify(Engine.flows));
})();

/* ================= Sonar robustness batch: Attack #9 (question-headline bear-baiting) ================= */
(function(){
  // Each headline carries a real JDATA.BEAR trigger word ("crisis",
  // "fall", "risk of", "warn") but ends in "?" (qMark=true). Individually
  // dampened on impact already (Sprint 5), but unguarded, still counted
  // FULLY toward the cluster's bear tally — this is the exact gap red-
  // team Session #1 flagged and asked for a golden-corpus stress test on.
  const questionFeed = [
    { id:'q1', cat:'markets', s:'Clickbait Blog', h:1, t:'Is banking about to face a crisis?', b:'' },
    { id:'q2', cat:'markets', s:'Clickbait Blog', h:2, t:'Will banking stocks fall further?', b:'' },
    { id:'q3', cat:'markets', s:'Clickbait Blog', h:3, t:'Are banking shares at risk of collapse?', b:'' },
    { id:'q4', cat:'markets', s:'Clickbait Blog', h:4, t:'Is the banking sector headed for crisis?', b:'' },
    { id:'q5', cat:'markets', s:'Clickbait Blog', h:5, t:'Should investors be warned about banking?', b:'' }
  ];
  Engine.run(questionFeed);
  const bankCluster = Engine.clusters.find(c => c.sector === 'banks');
  assert('Attack #9: a cluster built ENTIRELY from question-headline bear-baiting has bear=0 in the cluster tally (excluded, not just dampened)',
    !!bankCluster && bankCluster.bear === 0,
    JSON.stringify(bankCluster && { bull: bankCluster.bull, bear: bankCluster.bear, neut: bankCluster.neut }));
  assert('Attack #9: consequently NO caution idea is drafted from pure question-baiting alone',
    !Engine.ideas.some(i => i.kind === 'caution' && i.sector === 'banks'),
    JSON.stringify(Engine.ideas.filter(i=>i.sector==='banks').map(i=>i.kind)));
  assert('Attack #9: individual items still keep their own real senti classification for display — only the CLUSTER tally is guarded, not the per-item label',
    Engine.items.every(i => i.qMark === true) && Engine.items.some(i => i.senti === 'bear'),
    JSON.stringify(Engine.items.map(i => ({ senti: i.senti, qMark: i.qMark }))));

  // Control: the SAME wording as flat assertions (no "?") must still tip
  // fully into caution — proves the fix targets QUESTIONS specifically,
  // not bearish content in general (no regression on real bearish news).
  const assertionFeed = questionFeed.map(f => ({ ...f, t: f.t.replace(/\?$/, '.') }));
  Engine.run(assertionFeed);
  const bankClusterAssertion = Engine.clusters.find(c => c.sector === 'banks');
  assert('Attack #9 control: identical wording WITHOUT "?" counts fully toward bear and drafts a real caution idea — genuine bearish clusters are unaffected',
    !!bankClusterAssertion && bankClusterAssertion.bear > 0 && Engine.ideas.some(i => i.kind === 'caution' && i.sector === 'banks'),
    JSON.stringify(bankClusterAssertion));

  Engine.run(JDATA.FEED); // restore real state for subsequent tests
})();

/* ================= Sonar robustness batch: Attack #15 (visible compute cap) ================= */
(function(){
  const flood = [];
  for (let i = 0; i < Engine.MAX_ITEMS_PER_PASS + 40; i++){
    flood.push({ id:'f'+i, cat:'markets', s:'Flood Source', h: i, t:`Flood item number ${i} about markets today`, b:'' });
  }
  Engine.run(flood);
  assert('Attack #15: a flood beyond MAX_ITEMS_PER_PASS is capped, not silently processed in full (guards the O(n²) dedup pass)',
    Engine.truncation.capped === true && Engine.items.length === Engine.MAX_ITEMS_PER_PASS, JSON.stringify(Engine.truncation));
  assert('Attack #15: the cap reports EXACTLY how many were skipped',
    Engine.truncation.skipped === 40, JSON.stringify(Engine.truncation));
  assert('Attack #15: the FRESHEST items are kept (lowest .h), not an arbitrary prefix',
    Engine.items.every(i => i.h < Engine.MAX_ITEMS_PER_PASS), `max h kept = ${Math.max(...Engine.items.map(i=>i.h))}`);

  const h = Honesty.compute();
  const truncMetric = h.metrics.find(m => m.key === 'truncation');
  assert('Attack #15: Honesty.compute() surfaces the cap as a VISIBLE red metric — silent truncation during a flood is exactly when integrity matters most',
    !!truncMetric && truncMetric.band === 'red' && truncMetric.display.includes('40'), JSON.stringify(truncMetric));

  Engine.run(JDATA.FEED); // back under the cap
  assert('Attack #15: a normal-sized feed (under the cap) is NOT flagged as truncated — no false alarms on ordinary days',
    Engine.truncation.capped === false && Engine.truncation.skipped === 0, JSON.stringify(Engine.truncation));
  assert('Attack #15: Honesty.compute() has no truncation metric at all when nothing was capped',
    !Honesty.compute().metrics.some(m => m.key === 'truncation'));
})();

/* ---------------- UNITS GOLDEN BLOCK ----------------
   Every magnitude format Indian financial media actually uses must
   normalize to crore INR before any summation. If one of these fails,
   every flow total on the dashboard is arithmetic on mixed units. */
(function(){
  const R = Engine.USD_INR; // configurable; assertions derive from it, not from a hardcoded rate
  const cases = [
    ['₹5,000 crore committed to new fab',            5000],
    ['Rs 5,000 crore committed to new fab',          5000],
    ['Rs. 750 crore expansion approved',             750],
    ['₹500 cr order win announced',                  500],
    ['Rs 1.2 lakh crore capex plan unveiled',        120000],
    ['₹2 lakh crore infrastructure outlay',          200000],
    ['$14 billion investment pledged',               Math.round(14 * R * 100)],
    ['USD 2.5 bn funding round closed',              Math.round(2.5 * R * 100)],
    ['US$ 300 million plant announced',              Math.round(300 * R / 10)],
    ['$1 trillion economy milestone',                Math.round(1 * R * 100000)],
    ['5 crore subscribers milestone',                0], // people, not rupees — no currency marker, must NOT parse
    ['no amounts in this headline at all',           0]
  ];
  for (const [text, want] of cases){
    const got = Engine.parseAmount(text);
    assert(`UNITS: "${text}" → ${want} cr`, got === want, `got ${got}`);
  }
})();

/* ================= ORD-1704a: SCRAMBLE / NULL-MODEL TEST ================= */
(function(){
  function wordPool(items){ return items.flatMap(i => i.t.split(/\s+/)); }
  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  // Real run
  Engine.run(JDATA.FEED);
  const real = {
    clusters: Engine.clusters.length,
    topConviction: Engine.ideas.length ? Engine.ideas[0].conviction : 0,
    convictions: Engine.ideas.map(i => i.conviction)
  };

  // Scrambled run: shuffle the entire corpus's words across all titles,
  // preserving each title's word COUNT (length), so amounts/keyword density
  // per item survive by chance but the coherent story structure does not.
  const pool = shuffle(wordPool(JDATA.FEED));
  let cursor = 0;
  const scrambledRaw = JDATA.FEED.map(it => {
    const wc = it.t.split(/\s+/).length;
    const words = pool.slice(cursor, cursor + wc);
    cursor += wc;
    return { ...it, id: 's_' + it.id, t: words.join(' '), b: '' };
  });
  Engine.run(scrambledRaw);
  const scrambled = {
    clusters: Engine.clusters.length,
    topConviction: Engine.ideas.length ? Engine.ideas[0].conviction : 0,
    convictions: Engine.ideas.map(i => i.conviction)
  };

  // restore real state for anyone inspecting Engine after the page runs
  Engine.run(JDATA.FEED);

  info('ORD-1704a real distribution', `clusters=${real.clusters} topConviction=${real.topConviction} convictions=[${real.convictions.join(',')}]`);
  info('ORD-1704a scrambled distribution', `clusters=${scrambled.clusters} topConviction=${scrambled.topConviction} convictions=[${scrambled.convictions.join(',')}]`);
  assert('ORD-1704a: real corpus\'s top idea conviction is not weaker than the scrambled null model',
    real.topConviction >= scrambled.topConviction,
    `real=${real.topConviction} scrambled=${scrambled.topConviction} (if this FAILs, the conviction threshold may be decorating noise — see UPGRADE-ORDERS-PART5.txt ORD-1704)`);
})();

/* ================= Attack #13: cross-sector momentum over-count ================= */
(function(){
  const savedItems = Engine.items, savedClusters = Engine.clusters;
  const mk = (id, sectors, impact) => ({ id, t:'title '+id, b:'', h:1, s:'Src'+id, cat:'markets',
    sectors, entities:[], senti:'neut', impact, impactRaw:impact, amountCr:0, hype:false, flow:null });
  // Each sector has one dedicated item (impact 40) plus ONE shared item
  // tagged with BOTH sectors (impact 60). Correct math: the shared item
  // contributes 60/2 = 30 per cluster → momentum (40+30)×decay(h=1) ≈ 69.
  // The pre-fix bug counted it at full 60 in both → ≈ 99.
  Engine.items = [ mk('a', ['defence'], 40), mk('b', ['semis'], 40), mk('c', ['defence', 'semis'], 60) ];
  Engine.buildClusters();
  const defence = Engine.clusters.find(c => c.sector === 'defence');
  const semis = Engine.clusters.find(c => c.sector === 'semis');
  const expected = Math.round((40 + 30) * (1 - 1/96));
  assert('Attack #13: a two-sector item contributes impact/2 to each cluster, not full impact twice',
    defence && semis && defence.momentum === expected && semis.momentum === expected,
    `expected=${expected} defence=${defence?.momentum} semis=${semis?.momentum} (pre-fix double-count would read ${Math.round(100 * (1 - 1/96))})`);
  Engine.items = savedItems; Engine.clusters = savedClusters;
})();

/* ================= Sprint 5.5: schema versioning ================= */
(function(){
  const KEY = '__schema_test__';
  localStorage.removeItem(KEY);

  // Fresh key, no data yet: falls back cleanly, no throw.
  const empty = Schema.load(KEY, 1, 'FALLBACK', {});
  assert('Schema: missing key returns fallback', empty === 'FALLBACK', `got=${JSON.stringify(empty)}`);

  // Simulate pre-Sprint-5.5 data: no envelope, just the raw payload.
  localStorage.setItem(KEY, JSON.stringify({ foo: 'bar', n: 3 }));
  const migrated = Schema.load(KEY, 1, null, { 0: (data) => ({ ...data, migratedFrom: 0 }) });
  assert('Schema: unversioned (pre-Sprint-5.5) data is read as v0 and migrated forward',
    migrated && migrated.foo === 'bar' && migrated.migratedFrom === 0, JSON.stringify(migrated));

  // Round-trip through save/load at the same version: no migration should fire.
  Schema.save(KEY, 1, { x: 1 });
  const roundtrip = Schema.load(KEY, 1, null, { 0: () => { throw new Error('should not run'); } });
  assert('Schema: save/load round-trip at the same version does not invoke migrations',
    roundtrip && roundtrip.x === 1, JSON.stringify(roundtrip));

  // Multi-hop migration: v0 -> v1 -> v2, each hop applied once, in order.
  localStorage.setItem(KEY, JSON.stringify({ step: 0 }));
  const hopped = Schema.load(KEY, 2, null, {
    0: (data) => ({ step: data.step + 1 }),
    1: (data) => ({ step: data.step + 1 })
  });
  assert('Schema: chained migrations apply each hop once, in order',
    hopped && hopped.step === 2, JSON.stringify(hopped));

  // Missing migration for the current gap: stop at the last reachable version, don't throw.
  localStorage.setItem(KEY, JSON.stringify({ step: 0 }));
  const stalled = Schema.load(KEY, 5, null, { 0: (data) => ({ step: data.step + 1 }) });
  assert('Schema: an unregistered migration hop stalls gracefully instead of throwing',
    stalled && stalled.step === 1, JSON.stringify(stalled));

  localStorage.removeItem(KEY);
})();

(function(){
  // Closed two-cashflow position: bisection must land on the analytic root.
  const events = [
    { date:'2024-01-15', type:'buy', symbol:'HDFC', quantity:50, price:2500 },   // -125,000
    { date:'2025-01-15', type:'sell', symbol:'HDFC', quantity:-50, price:2750 }  // +137,500
  ];
  const d0 = new Date('2024-01-15'), d1 = new Date('2025-01-15');
  const years = (d1.getTime() - d0.getTime()) / (365*86400000);
  const expected = Math.pow(137500/125000, 1/years) - 1;
  const got = Ledger.xirr(events);
  assert('Ledger XIRR: bisection matches the closed-form root for a simple buy/sell pair',
    got !== null && Math.abs(got - expected) < 0.002, `expected=${(expected*100).toFixed(2)}% got=${got===null?'null':(got*100).toFixed(2)+'%'}`);
})();

(function(){
  // Session #4 Test 10 shape: multiple sign changes in the cash-flow series.
  // Bisection (no Newton-Raphson step) must still converge to a finite,
  // plausible rate instead of failing or throwing.
  const events = [
    { date:'2023-01-01', type:'buy', symbol:'X', quantity:100, price:1000 },   // -100,000
    { date:'2023-06-01', type:'sell', symbol:'X', quantity:-100, price:800 },  // +80,000 (loss)
    { date:'2023-06-15', type:'buy', symbol:'X', quantity:100, price:850 },    // -85,000 (re-entry)
    { date:'2024-06-01', type:'sell', symbol:'X', quantity:-100, price:1400 }  // +140,000 (gain)
  ];
  const got = Ledger.xirr(events);
  assert('Ledger XIRR: multi-sign-change cash flows converge to a finite, plausible rate (no throw)',
    got !== null && isFinite(got) && got > -0.5 && got < 1, `got=${got===null?'null':(got*100).toFixed(1)+'%'}`);
})();

   toward a goal meant deleting and re-adding it every time, losing
   createdAt and defeating the whole point of a goals tracker. */
(function(){

    ok === true && Goals.load()[0].currentValue === 450000, JSON.stringify(Goals.load()[0]));

(function(){
  function mkItem(id, title, h){
    return { id, t:title, b:'', h, s:'TestSource', cat:'markets', sectors:['x'], entities:[], senti:'neut', impact:10, amountCr:0, live:false };
  }
  const today = [mkItem('s1','xenoblade surges on results',1), mkItem('s2','xenoblade rally extends further',2),
    mkItem('s3','xenoblade momentum builds again',3), mkItem('s4','xenoblade breaks out today',4), mkItem('s5','xenoblade keeps climbing',5)];

  // Insufficient history: fewer than BASELINE_MIN_DAYS prior days.
  const tooFewDays = Sonar.termSpikes(today, [{date:'2020-01-01', termCounts:{}}]);
  assert('Sonar termSpikes: fewer than BASELINE_MIN_DAYS of history reports not-ready, not a noisy guess',
    tooFewDays.ready === false && tooFewDays.spikes.length === 0, JSON.stringify(tooFewDays));

  // Sufficient history, term absent from every prior day (baseline 0): today's
  // 5 mentions clears both the 2σ bar (0) and the SPIKE_MIN_COUNT floor.
  const zeroHistory = [{date:'2020-01-01', termCounts:{}}, {date:'2020-01-02', termCounts:{}}, {date:'2020-01-03', termCounts:{}}];
  const spikeResult = Sonar.termSpikes(today, zeroHistory);
  assert('Sonar termSpikes: a term absent from baseline history but present today is flagged',
    spikeResult.ready && spikeResult.spikes.some(s => s.term === 'xenoblade'),
    JSON.stringify(spikeResult.spikes.map(s=>s.term)));

  // Same term at a STABLE baseline (mean 5, low variance): today's 5 is
  // unremarkable and must NOT be flagged.
  const stableHistory = [{date:'2020-01-01', termCounts:{xenoblade:4}}, {date:'2020-01-02', termCounts:{xenoblade:5}}, {date:'2020-01-03', termCounts:{xenoblade:6}}];
  const noSpikeResult = Sonar.termSpikes(today, stableHistory);
  assert('Sonar termSpikes: a term at its normal historical level is not flagged',
    noSpikeResult.ready && !noSpikeResult.spikes.some(s => s.term === 'xenoblade'),
    JSON.stringify(noSpikeResult.spikes.map(s=>s.term)));

  // Floor test: only 2 mentions today (below SPIKE_MIN_COUNT) must never be
  // flagged, even against a zero baseline where it would otherwise "spike".
  const belowFloor = [mkItem('f1','raretoken mentioned once here',1), mkItem('f2','raretoken mentioned twice here',2)];
  const floorResult = Sonar.termSpikes(belowFloor, zeroHistory);
  assert('Sonar termSpikes: a count below SPIKE_MIN_COUNT is never flagged, regardless of baseline',
    !floorResult.spikes.some(s => s.term === 'raretoken'), JSON.stringify(floorResult.spikes.map(s=>s.term)));
})();

/* ---------------- Sonar robustness batch: median/MAD + Attack #5 (borrowed baseline) ---------------- */
(function(){
  assert('Sonar median: odd-length array returns the middle value',
    Sonar.median([1,3,2]) === 2);
  assert('Sonar median: even-length array averages the two middle values',
    Sonar.median([1,2,3,4]) === 2.5);
  assert('Sonar median: empty array is 0, not NaN',
    Sonar.median([]) === 0);
  assert('Sonar mad: MAD of [1,2,3,4,5] (median 3) is 1',
    Sonar.mad([1,2,3,4,5]) === 1);

  // Robustness proof: ONE wild outlier day should barely move a median
  // baseline, but visibly drags a mean baseline toward it — the exact
  // reason sonar.js's own comment flagged mean/stddev as fragile.
  const normalDays = [4,5,4,6,5,4,5];
  const withOutlier = [...normalDays, 200]; // one crazy day 2 weeks ago
  const meanShift = Sonar.mean(withOutlier) - Sonar.mean(normalDays);
  const medianShift = Sonar.median(withOutlier) - Sonar.median(normalDays);
  assert('Sonar robustness: a single outlier day shifts the MEAN far more than the MEDIAN (proves median/MAD is the right fix for this exact fragility)',
    Math.abs(meanShift) > Math.abs(medianShift) * 5, `meanShift=${meanShift.toFixed(1)} medianShift=${medianShift.toFixed(1)}`);

  function mkItem(id, title, h){
    return { id, t:title, b:'', h, s:'TestSource', cat:'markets', sectors:['x'], entities:[], senti:'neut', impact:10, amountCr:0, live:false };
  }

  // Attack #5 (red-team Session #1): a term with ZERO mentions in every
  // history day (a brand-new entity, or one just added to JDATA.COMPANIES)
  // has a degenerate own-series baseline (median 0, MAD 0) — which would
  // make ANY mention count read as an infinite-sigma "spike". When OTHER
  // real terms exist that day with genuine history, the cold-start term
  // should borrow THEIR cross-term baseline instead of its own fragile
  // zero — cold-start protection, not cold-start blindness OR hair-trigger.
  // NOTE: the borrowed-baseline pool is built ONLY from terms mentioned
  // in TODAY's items (termSpikes only iterates termCounts, which comes
  // from today's corpus) — so the term it borrows from must ALSO appear
  // today, not just in history. In real usage this is rarely a problem
  // (a normal day's corpus mentions dozens of established terms), but
  // the test must reflect that mechanism honestly, not assume it away.
  const coldStartToday = [
    mkItem('c1','brandnewstock announces results',1), mkItem('c2','brandnewstock reports growth',2),
    mkItem('c3','brandnewstock shares rise',3),
    mkItem('c4','establishedco quarterly update today',4), mkItem('c5','establishedco investor briefing held',5)
  ];
  // "establishedco" has a real, steady OWN history (median ~13) — this is
  // what the cold-start term borrows FROM, precisely because it's also
  // mentioned today (see note above).
  const historyWithRealTerm = [
    { date:'2020-01-01', termCounts:{ establishedco: 12 } },
    { date:'2020-01-02', termCounts:{ establishedco: 14 } },
    { date:'2020-01-03', termCounts:{ establishedco: 13 } }
  ];
  const coldResult = Sonar.termSpikes(coldStartToday, historyWithRealTerm);
  const coldSpike = coldResult.spikes.find(s => s.term === 'brandnewstock');
  assert('Attack #5: a cold-start term (never mentioned before) borrows the cross-term baseline instead of a degenerate zero — 3 mentions against a ~13-median borrowed baseline is NOT an infinite-sigma spike',
    coldResult.ready && !coldSpike, JSON.stringify(coldResult.spikes.map(s=>s.term)));

  // Same cold-start term, but NO other real-history terms exist that day
  // to borrow from — correctly falls back to its own (degenerate) zero
  // baseline, same as the pre-existing "term absent from history" test
  // above (this is the honest limit of "borrowed" protection: it needs
  // SOMETHING to borrow from).
  const noRealTermsHistory = [{date:'2020-01-01', termCounts:{}}, {date:'2020-01-02', termCounts:{}}, {date:'2020-01-03', termCounts:{}}];
  const noBorrowResult = Sonar.termSpikes(coldStartToday, noRealTermsHistory);
  const noBorrowSpike = noBorrowResult.spikes.find(s => s.term === 'brandnewstock');
  assert('Attack #5: with NOTHING to borrow from (no other real-history terms that day), a cold-start term correctly falls back to its own zero baseline and IS flagged — honest limit of the protection, not a silent gap',
    noBorrowResult.ready && !!noBorrowSpike && noBorrowSpike.borrowed === true, JSON.stringify(noBorrowResult.spikes));
})();

/* ================= Sprint 11: mirror full build (Brier + resolution) ================= */
(function(){
  const PKEY = Mirror.PRED_KEY;
  Schema.save(PKEY, Mirror.PRED_VERSION, [{ id:'r1', title:'Resolve me', probability:60, resolveBy:'2020-01-01', resolved:false, outcome:null, createdAt:Date.now() }]);

  const ok = Mirror.resolvePrediction('r1', true);
  const afterFirst = Mirror.loadPredictions().find(p => p.id === 'r1');
  assert('Mirror resolvePrediction: resolving an open prediction sets resolved=true and outcome=1 for YES',
    ok === true && afterFirst.resolved === true && afterFirst.outcome === 1, JSON.stringify(afterFirst));

  const okAgain = Mirror.resolvePrediction('r1', false);
  const afterSecond = Mirror.loadPredictions().find(p => p.id === 'r1');
  assert('Mirror resolvePrediction: an already-resolved prediction cannot be resolved again (no edit-in-place)',
    okAgain === false && afterSecond.outcome === 1, JSON.stringify(afterSecond));

  assert('Mirror resolvePrediction: a non-existent id returns false rather than throwing',
    Mirror.resolvePrediction('does-not-exist', true) === false);

  localStorage.removeItem(PKEY);
})();

(function(){
  const few = Array.from({ length: 10 }, (_, i) => ({ resolved:true, probability:70, outcome: i % 2 }));
  const belowGate = Mirror.brierScore(few);
  assert('Mirror brierScore: fewer than BRIER_MIN_N resolved predictions reports not-ready with the raw count',
    belowGate.ready === false && belowGate.n === 10, JSON.stringify(belowGate));

  const alwaysFifty = Array.from({ length: 15 }, (_, i) => ({ resolved:true, probability:50, outcome: i % 2 }));
  const fiftyResult = Mirror.brierScore(alwaysFifty);
  assert('Mirror brierScore: an "always 50/50" forecaster scores exactly the 0.25 baseline',
    fiftyResult.ready && fiftyResult.score === 0.25, JSON.stringify(fiftyResult));

  const wellCalibrated = Array.from({ length: 15 }, () => ({ resolved:true, probability:90, outcome:1 }));
  const wellResult = Mirror.brierScore(wellCalibrated);
  assert('Mirror brierScore: confident-and-correct predictions score well below the 0.25 baseline',
    wellResult.ready && wellResult.score < 0.25 && Math.abs(wellResult.score - 0.01) < 1e-9, JSON.stringify(wellResult));

  const badlyCalibrated = Array.from({ length: 15 }, () => ({ resolved:true, probability:90, outcome:0 }));
  const badResult = Mirror.brierScore(badlyCalibrated);
  assert('Mirror brierScore: confident-and-wrong predictions score well above the 0.25 baseline',
    badResult.ready && badResult.score > 0.25 && Math.abs(badResult.score - 0.81) < 1e-9, JSON.stringify(badResult));

  const unresolvedMixedIn = [...alwaysFifty, { resolved:false, probability:80, outcome:null }];
  const mixedResult = Mirror.brierScore(unresolvedMixedIn);
  assert('Mirror brierScore: unresolved predictions are excluded from N and the calculation',
    mixedResult.n === 15, JSON.stringify(mixedResult));
})();

/* ================= Live-data reach: Quotes.fetchLive/syncLivePrices ================= */
/* relay.js has carried a working GET /quote endpoint (Yahoo Finance
   proxy) since Sprint 12 with NO frontend caller until now. Mocks
   Live.relayAvailable/fetchWithTimeout — same style as the Persist
   fetch-mock block above. Async — must complete before the tally (see
   the render wrapper at the bottom), same convention as runPersistTests. */
async function runQuotesLiveTests(){
  const savedAvail = Live._relayUp, savedFetch = Live.fetchWithTimeout, savedPortfolio = Portfolio.state;

  try {
    // relay down → fetchLive returns null (never throws), syncLivePrices reports not-ready
    Live._relayUp = false;
    const r1 = await Quotes.fetchLive(['HDFCBANK']);
    assert('Quotes fetchLive: relay unreachable returns null, never throws (graceful degradation, same contract as Live/Persist)',
      r1 === null);

    Portfolio.state = { holdings:[{ id:'h1', name:'HAL', type:'Equity', qty:12, buy:3890, cur:4485 }], budget:{income:0,expense:0}, watchlist:[] };
    const r2 = await Quotes.syncLivePrices();
    assert('Quotes syncLivePrices: relay down → ready:false, holdings left untouched',
      r2.ready === false && Portfolio.state.holdings[0].cur === 4485, JSON.stringify(r2));

    // relay up → mock a real Yahoo chart-shaped response
    Live._relayUp = true;
    Live.fetchWithTimeout = async (url) => {
      if (url.includes('HAL.NS')) return JSON.stringify({ 'HAL.NS': { price: 4600, prevClose: 4485, changePct: 2.56 } });
      return JSON.stringify({});
    };
    const r3 = await Quotes.fetchLive(['HAL']);
    assert('Quotes fetchLive: relay up parses the Yahoo-shaped {SYMBOL.NS: {price,...}} response keyed back to the bare symbol',
      r3 && r3.HAL && r3.HAL.price === 4600, JSON.stringify(r3));

    Portfolio.state = { holdings:[
      { id:'h1', name:'HAL', type:'Equity', qty:12, buy:3890, cur:4485 },
      { id:'h2', name:'Some Unmapped Co', type:'Equity', qty:5, buy:100, cur:100 }
    ], budget:{income:0,expense:0}, watchlist:[] };
    const before = Date.now();
    const r4 = await Quotes.syncLivePrices();
    assert('Quotes syncLivePrices: a mapped holding is live-priced and stamped with liveAsOf (Art. 4 — "as of when")',
      r4.ready === true && r4.matched === 1 && Portfolio.state.holdings[0].cur === 4600 && Portfolio.state.holdings[0].liveAsOf >= before,
      JSON.stringify(r4));
    assert('Quotes syncLivePrices: a holding with no tracked NSE symbol is reported unmatched, not silently skipped',
      r4.unmatched.includes('Some Unmapped Co'), JSON.stringify(r4));
  } finally {
    Live._relayUp = savedAvail; Live.fetchWithTimeout = savedFetch; Portfolio.state = savedPortfolio;
    localStorage.removeItem(Portfolio.KEY);
  }
}

/* ================= Live-data reach: DIRECT_FEEDS source attribution ================= */
/* Real bug found by curling PIB's actual RSS live: single-publisher feed
   items carry NO per-item <source> tag (that's a Google-News-aggregator-
   only convention) — so every PIB/RBI/etc. item was silently falling back
   to the generic 'News Wire' label, which ALSO meant JDATA.SOURCE_WEIGHTS'
   official-tier weight (already keyed on "PIB"/"RBI"/"SEBI" by name) never
   actually applied to the very feeds it was written for. */
(function(){
  const PIB_SHAPED_XML = '<?xml version="1.0"?><rss version="2.0"><channel><title>Press Information Bureau</title>' +
    '<item><title>Cabinet approves new defence capex allocation</title><link>https://pib.gov.in/x</link></item>' +
    '</channel></rss>';

  const withOverride = Live.parseRss(PIB_SHAPED_XML, 'gov', 'PIB');
  assert('Live parseRss: a single-publisher feed with NO per-item <source> tag gets the sourceOverride name, not the generic fallback',
    withOverride.length === 1 && withOverride[0].s === 'PIB', JSON.stringify(withOverride[0]));
  assert('Live parseRss + JDATA.sourceWeight: the override name actually earns the official-tier weight end-to-end',
    JDATA.sourceWeight(withOverride[0].s) === 1.3, JDATA.sourceWeight(withOverride[0].s));

  const withoutOverride = Live.parseRss(PIB_SHAPED_XML, 'gov');
  assert('Live parseRss: with NO sourceOverride (the Google-News aggregator path), falls back to "News Wire" as before — old behavior preserved',
    withoutOverride[0].s === 'News Wire', JSON.stringify(withoutOverride[0]));

  assert('Live DIRECT_FEEDS: every entry has a name (so no feed can silently regress to generic attribution)',
    Live.DIRECT_FEEDS.every(f => typeof f.name === 'string' && f.name.length > 0),
    Live.DIRECT_FEEDS.filter(f => !f.name).map(f => f.url).join(', '));
  assert('Live DIRECT_FEEDS: SEBI, The Hindu BusinessLine, and CNBC-TV18 are present (verified-live additions)',
    ['SEBI', 'The Hindu BusinessLine', 'CNBC-TV18'].every(n => Live.DIRECT_FEEDS.some(f => f.name === n)));
})();

(function(){
  const LKEY = Ledger.KEY, NKEY = Counterfactual.NIFTY_KEY;
  localStorage.removeItem(LKEY); localStorage.removeItem(NKEY);

  // Not ready: no Nifty levels logged at all.
  Schema.save(LKEY, Ledger.VERSION, [{ id:'t1', date:'2024-01-15', type:'buy', symbol:'HDFC', quantity:50, price:2500 }]);
  const notReady = Counterfactual.indexXirr();
  assert('Counterfactual indexXirr: fewer than 2 logged Nifty levels reports not-ready',
    notReady.ready === false, JSON.stringify(notReady));

  // Constructed so the synthetic Nifty position gains EXACTLY the same %
  // as the real stock trade over the same two dates — the two XIRRs must
  // come out identical, proving the counterfactual math is a genuine
  // apples-to-apples comparison, not an approximation that happens to
  // look close.
  Schema.save(LKEY, Ledger.VERSION, [
    { id:'t1', date:'2024-01-15', type:'buy', symbol:'HDFC', quantity:50, price:2500 },
    { id:'t2', date:'2025-01-15', type:'sell', symbol:'HDFC', quantity:-50, price:2750 }
  ]);
  Schema.save(NKEY, Counterfactual.NIFTY_VERSION, [
    { date:'2024-01-15', level:20000 },
    { date:'2025-01-15', level:22000 } // 20000 -> 22000 is the same 1.10x the stock did (2500 -> 2750)
  ]);
  const real = Ledger.xirr();
  const idx = Counterfactual.indexXirr();
  assert('Counterfactual indexXirr: an index that moved by the exact same % as the stock, over the same dates, yields the same XIRR',
    idx.ready && idx.xirr !== null && real !== null && Math.abs(idx.xirr - real) < 1e-9,
    `real=${real} idx=${idx.xirr}`);

  localStorage.removeItem(LKEY); localStorage.removeItem(NKEY);
})();

  Brain.teach("what's hot right now", 'hedged');
  assert('Brain teach: a taught phrase overrides the regex table (user correction wins)',
    Brain.matchIntentId("what's hot right now") === 'hedged');
  Brain.forget("what's hot right now");
  assert('Brain forget: removing the taught phrase restores the grammar routing',
    Brain.matchIntentId("what's hot right now") === 'whats-hot');

  // Re-teaching replaces, never duplicates.
  Brain.teach('how risky is my book', 'hedged');
  assert('Brain teach: re-teaching a phrase replaces its routing with exactly one entry',
    Brain.loadTaught().filter(t => t.phrase === 'how risky is my book').length === 1 &&
    Brain.matchIntentId('how risky is my book') === 'hedged');

  assert('Brain forget: a phrase that was never taught returns false',
    Brain.forget('never taught this') === false);

  for (let i = 0; i < 120; i++) Brain.teach('filler phrase ' + i, 'whats-hot');
  assert('Brain teach: capped FIFO at TAUGHT_MAX',
    Brain.loadTaught().length === Brain.TAUGHT_MAX, `len=${Brain.loadTaught().length}`);

  Portfolio.state = savedPortfolio;
  localStorage.removeItem(TKEY); // corpus below must run against the untaught grammar
})();

/* ================= Brain v3.1: self-routing meta-test (table integrity) ================= */
/* Hardens the whole intent table against ordering bugs: every intent's
   own canonical example MUST route back to that intent. If a future
   intent is inserted in the wrong position and steals another's example,
   this fails loudly — the invisible first-wins ordering becomes tested. */
(function(){
  const misrouted = [];
  for (const intent of Brain.INTENTS){
    const example = Brain.INTENT_META[intent.id] && Brain.INTENT_META[intent.id].example;
    if (!example){ misrouted.push(`${intent.id}: no example`); continue; }
    const got = Brain.matchIntentId(example);
    if (got !== intent.id) misrouted.push(`"${example}" → ${got} (expected ${intent.id})`);
  }
  assert('Brain table: every intent\'s own canonical example routes back to itself (ordering integrity)',
    misrouted.length === 0, misrouted.join(' | '));
})();

/* ================= Brain v3.1: graded confidence (interpret) ================= */
(function(){
  const savedTaught = Brain.loadTaught();
  localStorage.removeItem(Brain.TAUGHT_KEY);

  // exact grammar match → 'match'
  const m = Brain.interpret("what's hot right now");
  assert('Brain interpret: an exact grammar hit is kind:match with the resolved intent',
    m.kind === 'match' && m.intent.id === 'whats-hot', JSON.stringify({ kind: m.kind, id: m.intent && m.intent.id }));

  // no rx match, one dominant vocab guess (score ≥2) → 'confident'
  const c = Brain.interpret('is my money safe and protected');
  assert('Brain interpret: a strong sole vocab guess (no rx match) is kind:confident with a stated interpretation',
    c.kind === 'confident' && c.intent.id === 'hedged' && typeof c.interpretation === 'string', JSON.stringify({ kind: c.kind, id: c.intent && c.intent.id }));

  // single weak token (score 1) is NOT enough to auto-answer → 'ambiguous'
  const weak = Brain.interpret('how risky is my book');
  assert('Brain interpret: a single weak token (score 1) is NOT confident — a wrong confident answer is worse than a chip',
    weak.kind === 'ambiguous' && weak.guesses.includes('single-stock-risk'), JSON.stringify(weak));

  // two intents tied at score 1 → 'ambiguous' with both
  const amb = Brain.interpret('my risk and my returns');
  assert('Brain interpret: two intents tied on one token each is kind:ambiguous listing both guesses',
    amb.kind === 'ambiguous' && amb.guesses.includes('single-stock-risk') && amb.guesses.includes('vs-index'), JSON.stringify(amb));

  // nothing recognisable → 'unknown'
  assert('Brain interpret: an unrecognisable query is kind:unknown (→ miss log + help)',
    Brain.interpret('zxqv frobnicate wibble').kind === 'unknown');

  // a taught phrase resolves as an exact 'match', not a guess
  Brain.teach('how much cushion do i have', 'hedged');
  const taught = Brain.interpret('how much cushion do i have');
  assert('Brain interpret: a taught phrase is kind:match (user correction outranks guessing)',
    taught.kind === 'match' && taught.intent.id === 'hedged', JSON.stringify({ kind: taught.kind, id: taught.intent && taught.intent.id }));
  localStorage.removeItem(Brain.TAUGHT_KEY);

  if (savedTaught.length) Schema.save(Brain.TAUGHT_KEY, Brain.TAUGHT_VERSION, savedTaught);
})();

/* ================= Brain v2.1: golden utterance corpus ================= */
/* THE brain-recall metric. Additive only — utterances are never removed
   or weakened to make a change pass; a failing row means the change
   broke real coverage. Third column notes rows that only pass because
   of a specific NORMALIZE_RULES entry. */
(function(){
  const CORPUS = [
    // canonical phrasings

    ['which sectors are contested', 'whats-contested'],
    ['what should i be worried about', 'worry'],

    ['what predictions are open', 'predictions-open'],
    ['any predictions coming due', 'predictions-due-soon'],
    ['any overdue predictions', 'predictions-due-soon'],
    ['how calibrated am i', 'calibration'],
    ["what's my brier score", 'calibration'],
    ['how much of my portfolio is in bullish calls', 'bullish-capital'],
    ['what if defence drops 15%', 'sector-shock'],
    ['what is the bull case for defence', 'sector-bull-case'],
    ['bearish signals in banking', 'sector-bear-case'],
    ["what's bearish in pharma", 'sector-bear-case'],
    ["what's my exposure to defence", 'sector-exposure'],
    ['do i own HAL', 'sector-exposure'],
    ["what's my worst-case sector", 'worst-case-sector'],
    ["what's my biggest single-stock risk", 'single-stock-risk'],
    ['how much of my portfolio is hedged', 'hedged'],
    ['am i beating the nifty', 'vs-index'],
    ['how often do i trade', 'trade-frequency'],
    ['did i follow my own rules this week', 'rules-check'],
    // paraphrases that pass ONLY via the normalizer
    ["what's buzzing in the market", 'whats-hot'],          // buzzing → hot
    ['mixed signals anywhere?', 'whats-contested'],          // mixed signals → contested
    ['show my pending predictions', 'predictions-open'],     // pending → open
    ["what's my forecast accuracy", 'calibration'],          // forecast accuracy → calibration
    ['what if banking tanks 20%', 'sector-shock'],           // tanks → drops
    ['how much am i invested in banking', 'sector-exposure'],// invested in → exposure to
    ["what's my biggest position", 'single-stock-risk'],     // biggest position → largest position
    ['am i too concentrated', 'single-stock-risk'],          // concentrated → concentration risk
    ['how protected am i', 'hedged'],                        // protected → hedged
    ['did i do better than the market', 'vs-index'],         // better than → beating
    ['am i lagging the index', 'vs-index'],                  // lagging → beating
    ['am i trading too much', 'trade-frequency'],            // trading too much → churning
    ['did i break any rules', 'rules-check'],                // break rules → rule break
    ["how's HAL doing", 'sector-exposure'],                  // how's X doing → exposure to X (Brain v3.2 company-level)
    ['how is defence doing', 'sector-exposure'],             // how is X doing → exposure to X
    // Brain v2.2 additions
    ['compare banking and defence', 'compare-sectors'],
    ['banking vs defence', 'compare-sectors'],
    ['give me the morning briefing', 'briefing'],
    ['brief me properly', 'briefing'],
    // Brain v3.3: contested-exposure (deeper composed reasoning)
    ['is my portfolio sitting in any contested sectors?', 'contested-exposure'],
    ['conflicting signals on my holdings', 'contested-exposure'],
    ['which sectors are contested', 'whats-contested'], // no "my/holding" — stays general, proves the two don't collide
    // scenario stress-test (causal-graph propagation)
    ['what if crude spikes 20%', 'scenario'],
    ['what happens if RBI cuts rates', 'scenario'],
    ['what if the rupee weakens', 'scenario'],
    ['impact of a VIX spike', 'scenario'],
    ['what if defence drops 15%', 'sector-shock'], // macro-free price shock stays with sector-shock
    // market-today: what actually moved, vs the hypotheticals above
    ["what is the reason behind today's Nifty 50 going up 1%", 'market-today'],
    ['why is the market down today', 'market-today'],
    ["what's driving the rally", 'market-today'],
    // negatives — must fall through to the personality table, not a wrong intent
    ['tell me a joke', null],

  ];
  const failures = [];

/* ================= staleness: age measured from the EXCHANGE stamp ================= */
/* "I don't want stale data" can't be delivered by wishing — no free feed
   is tick-live. What CAN be delivered is that staleness is always
   visible, measured from the exchange's own print time rather than from
   our fetch time (a 2s-old fetch can carry an hours-old print). */
(function(){
  const saved = Market.live;

  Market.live = {
    'NIFTY 50':   { price: 100, changePct: 1, quoteTime: Date.now() - 8000,    ts: Date.now() },
    'SENSEX':     { price: 200, changePct: 1, quoteTime: Date.now() - 300000,  ts: Date.now() }
  };
  assert('Market.ageSec: age comes from the exchange print time, NOT the fetch time — a fresh fetch of an old print reads old',
    Market.ageSec('NIFTY 50') === 8 && Market.ageSec('SENSEX') === 300,
    `${Market.ageSec('NIFTY 50')} / ${Market.ageSec('SENSEX')}`);

  assert('Market.ageRange: reports the STALEST print, so one wedged instrument cannot hide behind seven fresh ones',
    Market.ageRange().stalest === 300 && Market.ageRange().freshest === 8, JSON.stringify(Market.ageRange()));

  // Caught in live testing: judging the tape on ALL instruments painted
  // the badge amber every Indian morning because Brent/gold/Nasdaq futures
  // keep their own sessions. Freshness claims are scoped to the NSE clock.
  Market.live['BRENT $'] = { price: 80, changePct: 0, quoteTime: Date.now() - 960000, ts: Date.now() };
  assert('Market.nseAgeRange: a 16-minute-old Brent print does NOT count against NSE freshness (no crying wolf every morning)',
    Market.nseAgeRange().stalest === 300 && Market.ageRange().stalest === 960,
    `nse=${Market.nseAgeRange().stalest} all=${Market.ageRange().stalest}`);
  delete Market.live['BRENT $'];

  // no quoteTime from upstream → fall back to fetch time (pessimistic:
  // never claims fresher than it can prove)
  Market.live = { 'NIFTY 50': { price: 1, changePct: 0, quoteTime: null, ts: Date.now() - 45000 } };
  assert('Market.ageSec: with no exchange timestamp it falls back to fetch time rather than claiming zero age',
    Market.ageSec('NIFTY 50') === 45, String(Market.ageSec('NIFTY 50')));

  assert('Market.ageSec: an unknown instrument is null, never 0 (absence is not freshness)',
    Market.ageSec('NOT A THING') === null);

  assert('Market.fmtAge: compact and honest across scales',
    Market.fmtAge(8) === '8s' && Market.fmtAge(300) === '5m' && Market.fmtAge(7200) === '2h' && Market.fmtAge(null) === '—',
    [Market.fmtAge(8), Market.fmtAge(300), Market.fmtAge(7200), Market.fmtAge(null)].join(','));

  Market.live = saved;
})();

/* ================= corpus honesty: simulated data must announce itself ================= */
/* The most serious honesty defect this app could have is not a wrong
   number — it is an INVENTED headline wearing the costume of verified
   intelligence (source name, evidence grade, "CONFIRMED x2"). Momentum
   maths over a demo corpus is arithmetically correct and epistemically
   worthless; every answer built on it has to say so. */
(function(){
  const savedItems = Engine.items;

  Engine.items = [
    { t:'fake A', s:'PIB', senti:'bull', impact:50, sectors:['defence'], hype:false, entities:[], live:false },
    { t:'fake B', s:'RBI', senti:'bear', impact:40, sectors:['banks'],   hype:false, entities:[], live:false }
  ];
  assert('Brain.corpusNote: an all-simulated corpus is flagged as invented, in the answer itself',
    /SIMULATED/.test(Brain.corpusNote()) && /not real reporting/.test(Brain.corpusNote()), Brain.corpusNote());

  Engine.items[0].live = true;
  assert('Brain.corpusNote: a MIXED corpus reports the real/simulated split rather than rounding to "live"',
    /1 of 2/.test(Brain.corpusNote()), Brain.corpusNote());

  Engine.items.forEach(i => { i.live = true; });
  assert('Brain.corpusNote: a fully live corpus adds no warning (the notice must mean something when it appears)',
    Brain.corpusNote() === '', JSON.stringify(Brain.corpusNote()));

  Engine.items = [];
  assert('Brain.corpusNote: an empty corpus is silent, not falsely reassuring',
    Brain.corpusNote() === '');

  Engine.items = savedItems;
})();

/* ================= a live uplink retires the invented corpus ================= */
/* Labelling fabricated headlines is necessary but not sufficient: while
   they stay loaded they keep voting in momentum, corroboration and the
   ideas engine's conviction figures. A conviction % part-driven by an
   order that was never placed is a wrong number no disclaimer repairs. */
(function(){
  const savedItems = Engine.items, savedRun = Engine.run;
  Engine.run = function(items){ this.items = items; };   // isolate from the full pipeline

  Engine.items = [
    { t:'invented demo headline', s:'PIB', live:false, entities:[], sectors:[] },
    { t:'another invented one',   s:'RBI', live:false, entities:[], sectors:[] }
  ];
  Engine.ingest([{ id:'r1', t:'Real wire from a real outlet', s:'Reuters', h:1, cat:'markets', live:true }],
                { dropSimulated: true });
  assert('Engine.ingest(dropSimulated): real wires REPLACE the demo corpus rather than blending with it',
    Engine.items.length === 1 && Engine.items.every(i => i.live), JSON.stringify(Engine.items.map(i => i.t)));

  // Safety: a fetch that yields nothing must not empty the board.
  Engine.items = [{ t:'demo only', s:'PIB', live:false, entities:[], sectors:[] }];
  Engine.ingest([], { dropSimulated: true });
  assert('Engine.ingest(dropSimulated): an empty fetch leaves the existing board alone instead of wiping it',
    Engine.items.length === 1, JSON.stringify(Engine.items.map(i => i.t)));

  // Default behaviour (no flag) is unchanged — additive.
  Engine.items = [{ t:'demo', s:'PIB', live:false, entities:[], sectors:[] }];
  Engine.ingest([{ id:'r2', t:'Some new wire', s:'ET', h:1, cat:'markets', live:true }]);
  assert('Engine.ingest: without the flag the old additive behaviour is preserved',
    Engine.items.length === 2, JSON.stringify(Engine.items.map(i => i.t)));

  Engine.items = savedItems; Engine.run = savedRun;
})();

/* ================= the highest-stakes answer must carry the corpus warning ================= */
/* "which stocks to invest in" names REAL, BUYABLE tickers. Warning only
   that these are "drafts, not orders" guards the ADVICE while letting the
   EVIDENCE pass as real. If the corpus is invented, that has to be said
   in the same breath as the ticker. */
(function(){
  // app.js (the UI layer) is deliberately NOT loaded in this harness, so
  // `App` does not exist here — the intent calls App.gotoView() for its
  // side-effect of switching view. Stub the global for the duration.
  const savedItems = Engine.items, savedIdeas = Engine.ideas;
  const hadApp = typeof App !== 'undefined';
  if (!hadApp) window.App = { gotoView(){} };
  Engine.ideas = [{ label:'Infrastructure', conviction:84, horizon:'6-18 MO', kind:'long', sector:'infra', watch:['L&T','KNR Constructions','NCC'] }];
  const ideaIntent = Jarvis.INTENTS.find(i => i.rx.test('which stocks to invest in'));

  Engine.items = [{ t:'fake', s:'PIB', senti:'bull', impact:50, sectors:['infra'], hype:false, entities:[], live:false }];
  const simAnswer = ideaIntent.fn.call(Jarvis);
  assert('Ideas answer: naming real tickers off an INVENTED corpus states that the evidence is simulated, not just that it is "not advice"',
    /SIMULATED/.test(simAnswer) && /L&amp;T|L&T/.test(simAnswer), simAnswer.slice(0, 200));

  Engine.items = [{ t:'real', s:'PIB', senti:'bull', impact:50, sectors:['infra'], hype:false, entities:[], live:true }];
  const liveAnswer = ideaIntent.fn.call(Jarvis);
  assert('Ideas answer: on a fully real corpus the simulated warning is absent (it must mean something when it appears)',
    !/SIMULATED/.test(liveAnswer) && /not orders/.test(liveAnswer), liveAnswer.slice(0, 200));

  Engine.items = savedItems; Engine.ideas = savedIdeas;
  if (!hadApp) delete window.App;
})();

/* ================= LocalLLM: model resolution ================= */
/* Regression for a bug that shipped in the first cut of local-llm.js: it
   hardcoded MODEL:'qwen2.5:14b' and probed with an EXACT name match, so on
   a machine holding 'qwen2.5-coder:14b' the feature silently never armed —
   no error, no log, just permanently unavailable. Resolution now happens
   against the live installed list. */
(function(){
  const savedOverride = LocalLLM.modelOverride;
  LocalLLM.modelOverride = null;

  assert('LocalLLM.pickModel: prefers the instruct build when present (routing/critique is language work, not code work)',
    LocalLLM.pickModel(['qwen2.5-coder:14b', 'qwen2.5:14b', 'llama3:8b']) === 'qwen2.5:14b');

  assert('LocalLLM.pickModel: falls back to the coder build rather than disabling itself — THE ORIGINAL BUG',
    LocalLLM.pickModel(['qwen2.5-coder:14b']) === 'qwen2.5-coder:14b');

  assert('LocalLLM.pickModel: 14B outranks 7B ("slower but better" was the explicit instruction)',
    LocalLLM.pickModel(['qwen2.5-coder:7b', 'qwen2.5-coder:14b']) === 'qwen2.5-coder:14b');

  assert('LocalLLM.pickModel: an unanticipated qwen2.5 tag still works instead of failing over a suffix',
    LocalLLM.pickModel(['qwen2.5:32b-instruct-q8_0']) === 'qwen2.5:32b-instruct-q8_0');

  assert('LocalLLM.pickModel: nothing suitable installed returns null — an honest off, not a silent one',
    LocalLLM.pickModel(['llama3:8b', 'mistral:7b']) === null && LocalLLM.pickModel([]) === null);

  LocalLLM.modelOverride = 'qwen2.5-coder:7b';
  assert('LocalLLM.pickModel: an explicit user override beats the preference order',
    LocalLLM.pickModel(['qwen2.5:14b', 'qwen2.5-coder:7b']) === 'qwen2.5-coder:7b');

  LocalLLM.modelOverride = 'qwen2.5:70b';
  assert('LocalLLM.pickModel: an override naming a model that is NOT installed is ignored, not obeyed into a dead end',
    LocalLLM.pickModel(['qwen2.5:14b']) === 'qwen2.5:14b');

  LocalLLM.modelOverride = savedOverride;
})();

/* ================= LocalLLM: route-don't-answer containment ================= */
/* The whole safety case rests on one property: nothing the model emits
   can become a displayed fact. It may return an intent ID (whose answer
   is then built by the deterministic template) or questions. These
   assertions attack that boundary with hostile model output. */
async function runLocalLlmTests(){
  const realFetch = window.fetch;
  const saved = { enabled: LocalLLM.enabled, available: LocalLLM.available };
  const IDS = ['whats-hot', 'hedged', 'calibration'];
  const mock = resp => { window.fetch = () => Promise.resolve({ ok: true, json: () => Promise.resolve({ response: resp }) }); };

  LocalLLM.enabled = true; LocalLLM.available = true;

  assert('LocalLLM.route: a valid id from the allowed list is accepted',
    (await (mock('hedged'), LocalLLM.route('am i safe', IDS))) === 'hedged');

  assert('LocalLLM.route: an id NOT in the allowed list is discarded — a hallucinated route can never fire',
    (await (mock('buy-tesla-now'), LocalLLM.route('x', IDS))) === null);

  assert('LocalLLM.route: "NONE" (honest abstention) yields null, not a forced wrong route',
    (await (mock('NONE'), LocalLLM.route('what is the weather', IDS))) === null);

  assert('LocalLLM.route: prose/preamble around an id is rejected rather than substring-matched into a route',
    (await (mock('I think the answer is probably hedged'), LocalLLM.route('x', IDS))) === null);

  assert('LocalLLM.route: a fabricated NUMBER in the response can never be routed or surfaced',
    (await (mock('NIFTY is at 24,225 and rising'), LocalLLM.route('x', IDS))) === null);

  assert('LocalLLM.route: empty / garbage response degrades to null',
    (await (mock(''), LocalLLM.route('x', IDS))) === null &&
    (await (mock('   \n  '), LocalLLM.route('x', IDS))) === null);

  // critique() must yield QUESTIONS only — an assertion is the model
  // drifting into stating facts, which is exactly what must not reach the user.
  assert('LocalLLM.critique: keeps questions, drops any declarative line (a stated "fact" from the model is filtered out)',
    (await (mock('What would falsify this thesis?\nHAL will definitely rise 40% this year.\nWhat is your exit trigger?\nWhat evidence supports the demand assumption?'),
      LocalLLM.critique('Defence spending is structurally rising and HAL is the prime beneficiary of the order book.')))
      .every(q => q.endsWith('?')));

  assert('LocalLLM.critique: a response with no questions at all yields null rather than surfacing assertions',
    (await (mock('This thesis is excellent. Buy immediately.'),
      LocalLLM.critique('Defence spending is structurally rising and HAL benefits from the order book.'))) === null);

  assert('LocalLLM.critique: refuses to run on a stub thesis (nothing meaningful to interrogate)',
    (await (mock('What?'), LocalLLM.critique('too short'))) === null);

  // the master switch
  LocalLLM.enabled = false;
  assert('LocalLLM: disabled is truly inert — no call is made even with a model reachable (Art. 12, opt-in only)',
    (await (mock('hedged'), LocalLLM.route('am i safe', IDS))) === null);

  LocalLLM.enabled = true;
  window.fetch = () => Promise.reject(new Error('ECONNREFUSED'));
  LocalLLM.available = true;
  assert('LocalLLM: Ollama unreachable degrades silently to null — chat falls back to the existing chips, never throws',
    (await LocalLLM.route('am i safe', IDS)) === null);

  window.fetch = realFetch;
  LocalLLM.enabled = saved.enabled; LocalLLM.available = saved.available;
}

/* ================= Charts: negative-radius crash (found via live Chrome testing) ================= */
/* donut() and radar() computed R from the canvas's live bounding rect
   with no floor — size() clamps the canvas itself to a 10x10 minimum
   (e.g. mid-layout during a view transition, container still 0-width),
   but R = Math.min(w,h)/2 - 8 on a 10x10 canvas is -3, and passing a
   negative radius to ctx.arc() throws IndexSizeError uncaught. Caught
   live: two real exceptions fired in Chrome navigating My Money mid-
   scroll. Both now clamp R to a minimum of 4px. */
(function(){
  const mkTinyCanvas = () => {
    const c = document.createElement('canvas');
    document.body.appendChild(c);
    c.getBoundingClientRect = () => ({ width: 0, height: 0, top: 0, left: 0 });
    return c;
  };

  let donutThrew = false;
  try {
    const c = mkTinyCanvas();
    Charts.donut(c, [{ label: 'A', value: 1 }, { label: 'B', value: 1 }]);
    c.remove();
  } catch(e){ donutThrew = e; }
  assert('Charts.donut: a mid-layout 0-size canvas (size() floors it at 10x10) never drives R negative into ctx.arc()',
    !donutThrew, String(donutThrew));

  let radarThrew = false;
  try {
    const c = mkTinyCanvas();
    Charts.radar(c, [{ label: 'X', angle: 30, strength: .5, senti: 'bull' }]);
    c.remove();
  } catch(e){ radarThrew = e; }
  assert('Charts.radar: same 0-size-canvas guard applied to the Sector Radar panel',
    !radarThrew, String(radarThrew));
})();

/* ---------------- render (awaits the one async block) ---------------- */
(async () => {
  await runPersistTests(); // async — must complete before we tally
  await runQuotesLiveTests(); // async — same reason
  await runLocalLlmTests(); // async — same reason

  const out = document.getElementById('out');
  out.innerHTML = '<h2>Results</h2>' + results.map(r => `
    <div class="row">
      <span class="tag ${r.info ? 'info' : (r.pass ? 'pass' : 'fail')}">${r.info ? 'INFO' : (r.pass ? 'PASS' : 'FAIL')}</span>
      <span>${r.name}</span>
      ${r.detail ? `<span style="color:#7e91ad">— ${r.detail}</span>` : ''}
    </div>`).join('');

  const total = results.filter(r => !r.info).length;
  const passed = results.filter(r => !r.info && r.pass).length;
  document.getElementById('summary').innerHTML =
    `<b>${passed}/${total} assertions passed.</b>` + (passed < total ? ' <span class="fail">Check FAILs above.</span>' : ' <span class="pass">All green.</span>');
})();
